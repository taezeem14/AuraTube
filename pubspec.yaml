name: new_youtube
description: "AuraTube: Modern high-performance YouTube & Shorts client in Flutter powered by NewPipe architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  youtube_explode_dart: ^3.1.0
  video_player: ^2.9.2
  just_audio: ^0.9.44
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  audio_video_progress_bar: ^2.0.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.3
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  http: ^1.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/
